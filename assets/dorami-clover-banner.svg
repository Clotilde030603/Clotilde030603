<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Dorami's GitHub</title>
  <desc id="desc">A bold matcha green banner with a large four-leaf clover and smaller clovers drifting down.</desc>
  <defs>
    <linearGradient id="matcha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf2e3" />
      <stop offset="1" stop-color="#dce8d1" />
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86a975" />
      <stop offset="1" stop-color="#52794e" />
    </linearGradient>
    <g id="clover">
      <g fill="url(#leaf)" stroke="#456d49" stroke-width=".7" stroke-linejoin="round">
        <path d="M0 0 C-7-3-14-10-11-17 C-8-24 0-22 0-16 C0-22 8-24 11-17 C14-10 7-3 0 0Z" />
        <path d="M0 0 C-7-3-14-10-11-17 C-8-24 0-22 0-16 C0-22 8-24 11-17 C14-10 7-3 0 0Z" transform="rotate(90)" />
        <path d="M0 0 C-7-3-14-10-11-17 C-8-24 0-22 0-16 C0-22 8-24 11-17 C14-10 7-3 0 0Z" transform="rotate(180)" />
        <path d="M0 0 C-7-3-14-10-11-17 C-8-24 0-22 0-16 C0-22 8-24 11-17 C14-10 7-3 0 0Z" transform="rotate(270)" />
      </g>
      <g fill="none" stroke="#dce9d3" stroke-width="1.15" stroke-linecap="round" opacity=".9">
        <path d="M0-2 Q0-9 0-17" />
        <path d="M2 0 Q9 0 17 0" />
        <path d="M0 2 Q0 9 0 17" />
        <path d="M-2 0 Q-9 0-17 0" />
      </g>
      <path d="M0 0 Q5 10 14 17" fill="none" stroke="#456d49" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#matcha)" />
  <rect x="1" y="1" width="1198" height="298" rx="27" fill="none" stroke="#f8faF3" stroke-opacity=".86" stroke-width="2" />
  <circle cx="210" cy="150" r="94" fill="#cbdcbe" opacity=".62" />
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="704" y="166" font-size="66" font-weight="740" letter-spacing="-2.2" fill="#304d35">Dorami's GitHub</text>
  </g>
  <g transform="translate(210 140) scale(2.75)"><use href="#clover" /></g>
  <g opacity=".96">
    <g><animateTransform attributeName="transform" type="translate" values="365 -42;390 335" dur="10s" repeatCount="indefinite" /><g><animateTransform attributeName="transform" type="rotate" values="-14;346" dur="10s" repeatCount="indefinite" /><g transform="scale(.9)"><use href="#clover" /></g></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="1080 -38;1060 335" dur="11s" begin="-4s" repeatCount="indefinite" /><g transform="scale(1.05)"><use href="#clover" /></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="1125 -40;1145 335" dur="9s" begin="-6s" repeatCount="indefinite" /><g transform="scale(.72)"><use href="#clover" /></g></g>
  </g>
