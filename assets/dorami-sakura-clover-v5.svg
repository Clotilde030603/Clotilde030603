<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Dorami's GitHub</title>
  <desc id="desc">A matcha four-leaf clover and soft pink cherry blossoms falling through a transparent night sky.</desc>
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5c985" />
      <stop offset="1" stop-color="#6f985d" />
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe4e8" />
      <stop offset="1" stop-color="#efaebe" />
    </linearGradient>
    <g id="blossom">
      <path d="M0 0 C-5-4-7-12-3-16 C-1-19 1-19 3-16 C7-12 5-4 0 0Z" fill="url(#petal)" stroke="#f4c7d0" stroke-width=".6" />
      <path d="M0 0 C-5-4-7-12-3-16 C-1-19 1-19 3-16 C7-12 5-4 0 0Z" fill="url(#petal)" stroke="#f4c7d0" stroke-width=".6" transform="rotate(72)" />
      <path d="M0 0 C-5-4-7-12-3-16 C-1-19 1-19 3-16 C7-12 5-4 0 0Z" fill="url(#petal)" stroke="#f4c7d0" stroke-width=".6" transform="rotate(144)" />
      <path d="M0 0 C-5-4-7-12-3-16 C-1-19 1-19 3-16 C7-12 5-4 0 0Z" fill="url(#petal)" stroke="#f4c7d0" stroke-width=".6" transform="rotate(216)" />
      <path d="M0 0 C-5-4-7-12-3-16 C-1-19 1-19 3-16 C7-12 5-4 0 0Z" fill="url(#petal)" stroke="#f4c7d0" stroke-width=".6" transform="rotate(288)" />
      <circle r="2.2" fill="#f4d693" />
    </g>
    <path id="petalFall" d="M0-10 C-7-5-6 3 0 8 C6 3 7-5 0-10Z" fill="url(#petal)" stroke="#f4c7d0" stroke-width=".8" />
  </defs>
  <g transform="translate(220 137) scale(2.5)"><text x="0" y="16" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="46">🍀</text></g>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="720" y="165" font-size="66" font-weight="740" letter-spacing="-2.2" fill="#dcebd0">Dorami's GitHub</text>
  </g>
  <g>
