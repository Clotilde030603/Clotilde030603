      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.64;.82" dur="10s" repeatCount="indefinite" />
      <g transform="rotate(-12)"><animateTransform attributeName="transform" type="rotate" values="-12;348" dur="10s" repeatCount="indefinite" /><g transform="scale(.88)"><text x="0" y="16" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="46">🍀</text></g></g>
    </g>
