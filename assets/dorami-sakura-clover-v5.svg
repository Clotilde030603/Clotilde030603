      <animateTransform attributeName="transform" type="translate" values="1140 -42;1120 338" dur="9s" begin="-6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.64;.82" dur="9s" repeatCount="indefinite" />
      <g transform="scale(.72)"><text x="0" y="16" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="46">🍀</text></g>
    </g>
  </g>
  <g>
