<svg xmlns="http://www.w3.org/2000/svg" width="48" height="780" viewBox="0 0 48 780" role="img" aria-label="Falling clovers and cherry blossoms">
  <defs>
    <linearGradient id="sakura" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3e8" />
      <stop offset="1" stop-color="#e9a7b9" />
    </linearGradient>
    <g id="flower" fill="url(#sakura)" stroke="#f2c3cf" stroke-width=".4">
      <path d="M0 0 C-3-3-4-7-2-9 C-1-11 1-11 2-9 C4-7 3-3 0 0Z" />
      <path d="M0 0 C-3-3-4-7-2-9 C-1-11 1-11 2-9 C4-7 3-3 0 0Z" transform="rotate(72)" />
      <path d="M0 0 C-3-3-4-7-2-9 C-1-11 1-11 2-9 C4-7 3-3 0 0Z" transform="rotate(144)" />
      <path d="M0 0 C-3-3-4-7-2-9 C-1-11 1-11 2-9 C4-7 3-3 0 0Z" transform="rotate(216)" />
      <path d="M0 0 C-3-3-4-7-2-9 C-1-11 1-11 2-9 C4-7 3-3 0 0Z" transform="rotate(288)" />
      <circle r="1" fill="#f4d693" stroke="none" />
    </g>
    <path id="petal" d="M0-7 C-5-3-4 3 0 6 C4 3 5-3 0-7Z" fill="url(#sakura)" />
  </defs>
  <g transform="translate(12 90)">
    <animateTransform attributeName="transform" type="translate" values="12 24;28 790" dur="14s" begin="-2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.88;1" dur="14s" begin="-2s" repeatCount="indefinite" />
    <text x="0" y="7" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="19">🍀</text>
  </g>
  <g transform="translate(35 190)">
    <animateTransform attributeName="transform" type="translate" values="35 22;20 790" dur="16s" begin="-8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.88;1" dur="16s" begin="-8s" repeatCount="indefinite" />
    <g transform="scale(.65)"><use href="#flower" /></g>
  </g>
  <g transform="translate(18 300)">
    <animateTransform attributeName="transform" type="translate" values="18 20;34 790" dur="13s" begin="-5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.88;1" dur="13s" begin="-5s" repeatCount="indefinite" />
    <g transform="rotate(20)"><animateTransform attributeName="transform" type="rotate" values="20;380" dur="13s" begin="-5s" repeatCount="indefinite" /><g transform="scale(.65)"><use href="#petal" /></g></g>
  </g>
  <g transform="translate(39 410)">
    <animateTransform attributeName="transform" type="translate" values="39 24;22 790" dur="18s" begin="-13s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.88;1" dur="18s" begin="-13s" repeatCount="indefinite" />
    <text x="0" y="7" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" font-size="16">🍀</text>
  </g>
  <g transform="translate(9 525)">
    <animateTransform attributeName="transform" type="translate" values="9 22;26 790" dur="15s" begin="-10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.88;1" dur="15s" begin="-10s" repeatCount="indefinite" />
    <g transform="scale(.78)"><use href="#flower" /></g>
  </g>
  <g transform="translate(28 655)">
    <animateTransform attributeName="transform" type="translate" values="28 22;11 790" dur="17s" begin="-4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.88;1" dur="17s" begin="-4s" repeatCount="indefinite" />
    <g transform="rotate(-25)"><animateTransform attributeName="transform" type="rotate" values="-25;335" dur="17s" begin="-4s" repeatCount="indefinite" /><g transform="scale(.7)"><use href="#petal" /></g></g>
  </g>
</svg>
